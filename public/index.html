<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Maps Fake Review Detector</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f5f7;
        color: #1f2937;
      }

      .container {
        max-width: 900px;
        margin: 2rem auto;
        padding: 1rem;
      }

      .card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 1.25rem;
      }

      textarea {
        width: 100%;
        min-height: 90px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        padding: 0.8rem;
        font-size: 0.95rem;
      }

      button {
        margin-top: 0.8rem;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 0.7rem 1rem;
        cursor: pointer;
        font-size: 0.95rem;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .error {
        margin-top: 0.75rem;
        color: #b91c1c;
        font-weight: 600;
      }

      .warning {
        margin-top: 0.75rem;
        color: #92400e;
        font-weight: 600;
      }

      .summary {
        margin-top: 1rem;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.75rem;
      }

      .metric {
        background: #eef2ff;
        border-radius: 10px;
        padding: 0.8rem;
        text-align: center;
      }

      .reviews {
        margin-top: 1rem;
        display: grid;
        gap: 0.8rem;
      }

      .review {
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 0.8rem;
      }

      .label-fake {
        color: #b91c1c;
        font-weight: 700;
      }

      .label-genuine {
        color: #166534;
        font-weight: 700;
      }

      ul {
        margin: 0.5rem 0 0;
        padding-left: 1.2rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Google Maps Review Authenticity Checker</h1>
      <div class="card">
        <p>Paste a Google Maps place link (containing <code>place_id</code>) to fetch reviews and classify likely fake vs genuine.</p>
        <textarea id="mapsUrl" placeholder="Paste Google Maps URL here..."></textarea>
        <button id="analyzeBtn">Analyze Reviews</button>
        <p id="error" class="error"></p>
        <p id="warning" class="warning"></p>

        <div id="result" style="display:none;">
          <h2 id="placeName"></h2>
          <div class="summary">
            <div class="metric"><strong>Total</strong><br /><span id="totalReviews"></span></div>
            <div class="metric"><strong>Likely Genuine</strong><br /><span id="genuineReviews"></span></div>
            <div class="metric"><strong>Likely Fake</strong><br /><span id="fakeReviews"></span></div>
          </div>
          <div class="reviews" id="reviews"></div>
        </div>
      </div>
    </div>

    <script>
      const analyzeBtn = document.getElementById('analyzeBtn');
      const mapsUrlInput = document.getElementById('mapsUrl');
      const errorEl = document.getElementById('error');
      const resultEl = document.getElementById('result');
      const reviewsEl = document.getElementById('reviews');
      const warningEl = document.getElementById('warning');

      analyzeBtn.addEventListener('click', async () => {
        const mapsUrl = mapsUrlInput.value.trim();
        errorEl.textContent = '';
        resultEl.style.display = 'none';
        reviewsEl.innerHTML = '';
        warningEl.textContent = '';

        if (!mapsUrl) {
          errorEl.textContent = 'Please paste a Google Maps URL.';
          return;
        }

        analyzeBtn.disabled = true;
        analyzeBtn.textContent = 'Analyzing...';

        try {
          const response = await fetch('/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mapsUrl })
          });

          const payload = await response.json();

          if (!response.ok) {
            throw new Error(payload.error || 'Unable to analyze reviews.');
          }

          document.getElementById('placeName').textContent = `${payload.place.name} (⭐ ${payload.place.rating ?? 'N/A'})`;
          warningEl.textContent = payload.warning || '';
          document.getElementById('totalReviews').textContent = payload.summary.totalReviews;
          document.getElementById('genuineReviews').textContent = payload.summary.likelyGenuine;
          document.getElementById('fakeReviews').textContent = payload.summary.likelyFake;

          payload.reviews.forEach((review) => {
            const card = document.createElement('div');
            card.className = 'review';

            const reasons = review.reasons.length
              ? `<ul>${review.reasons.map((reason) => `<li>${reason}</li>`).join('')}</ul>`
              : '<p>No suspicious indicators detected.</p>';

            card.innerHTML = `
              <strong>${review.author}</strong> · ${review.timeDescription}<br />
              Rating: ${review.rating ?? 'N/A'}<br />
              <span class="${review.label === 'Likely Fake' ? 'label-fake' : 'label-genuine'}">${review.label}</span>
              <p>${review.text || '(No review text)'}</p>
              ${reasons}
            `;

            reviewsEl.appendChild(card);
          });

          resultEl.style.display = 'block';
        } catch (error) {
          errorEl.textContent = error.message;
        } finally {
          analyzeBtn.disabled = false;
          analyzeBtn.textContent = 'Analyze Reviews';
        }
      });
    </script>
  </body>
</html>
